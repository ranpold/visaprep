<section class="wrap narrow" style="padding:32px 16px 48px">
  <h1>Visa Document Checklist</h1>
  <p class="muted">Choose your visa to get a tick-box checklist. Your progress is saved in this browser. Requirements differ by nationality and consulate, so always confirm with the official source linked below.</p>

  <div class="row no-print" style="margin-top:20px">
    <div>
      <label for="visa">Visa</label>
      <select id="visa"></select>
    </div>
  </div>

  {{ad:top}}

  <div id="checklist-out"></div>

  <div class="actions no-print" style="margin-top:20px">
    <button class="btn btn-primary" id="print-list">Print checklist</button>
    <button class="btn btn-ghost" id="reset-list">Reset ticks</button>
  </div>
</section>
